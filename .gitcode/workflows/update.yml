# Scheduled manifest update.
#
# GitCode's hosted runners are Linux only (ubuntu-latest / euler-latest), so this
# runs scripts/update.py (stdlib-only Python, no Scoop/Windows needed).
name: update-manifests

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  # Optional: raises the GitHub API rate limit from 60/h to 5000/h.
  # Add a repo secret named GH_TOKEN for it; without it the updater still works
  # by falling back to the releases.atom feed.
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

stages:
  update:
    name: checkver
    jobs:
      JOB_update:
        name: update
        runs-on: default
        steps:
          - name: Checkout
            identifier: checkout
            uses: checkout

          - name: Update manifests
            identifier: run_update
            run: |
              cd repo_workspace
              python3 scripts/update.py

          - name: Commit and push
            identifier: commit_push
            run: |
              cd repo_workspace
              if git diff --quiet -- bucket; then
                echo "no changes"
                exit 0
              fi
              git config user.name "gitcode-ci"
              git config user.email "ci@gitcode.com"
              git add bucket
              git commit -m "chore: auto-update manifests"
              git push origin HEAD:main
        if: "${{ default() }}"
    pre:
      - type: auto
    fail-fast: true