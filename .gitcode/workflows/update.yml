# 定时探测上游新版本并提交 manifest 变更。
#
# 注意：Scoop 的 checkver 依赖 Windows 上的 Scoop 本体，因此本流水线必须跑在
# Windows runner 上。GitCode 默认的 EulerOS runner 跑不了，需要在「流水线 → 运行器」
# 里注册一台 Windows runner 并给仓库打上 windows 标签；没有的话请用 README 里的
# 计划任务方案（schtasks），效果完全相同。
name: update-manifests

on:
  schedule:
    - cron: '0 4 * * *' # 每天 UTC 04:00
  workflow_dispatch:

stages:
  update:
    name: checkver
    jobs:
      JOB_update:
        name: update
        runs-on: [self-hosted, windows]
        steps:
          - name: Checkout
            identifier: checkout
            uses: checkout

          - name: Run checkver
            identifier: run_checkver
            run: |
              cd repo_workspace
              pwsh -NoProfile -File scripts/update.ps1 -Commit

          - name: Push changes
            identifier: push
            if: "${{ steps.run_checkver.outcome == 'success' }}"
            run: |
              cd repo_workspace
              git config user.name "gitcode-actions"
              git config user.email "actions@gitcode.com"
              git push origin HEAD
        if: "${{ default() }}"
    pre:
      - type: auto
    fail-fast: true
