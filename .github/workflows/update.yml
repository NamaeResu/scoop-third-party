# Scheduled manifest update.
#
# Runs the per-app updaters in scripts/ on a Linux runner (stdlib-only Python, no
# Scoop/Windows needed). Every *.py there owns exactly one manifest:
# scripts/aoci-code.py -> bucket/aoci-code.json,
# scripts/flutter-ohos-341.py -> bucket/flutter-ohos-341.json.
name: update-manifests

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update manifests
        run: |
          : > update-failures.txt
          for script in scripts/*.py; do
            echo "== $script"
            python3 "$script" || echo "$script" >> update-failures.txt
          done

      - name: Commit and push
        run: |
          if git diff --quiet -- bucket; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bucket
            git commit -m "chore: auto-update manifests"
            git push origin HEAD:main
          fi

      - name: Fail on updater errors
        run: |
          if [ -s update-failures.txt ]; then
            echo "these updaters failed:" >&2
            cat update-failures.txt >&2
            exit 1
          fi
          echo "all updaters ok"
